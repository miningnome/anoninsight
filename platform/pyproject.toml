[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vip"
version = "0.1.0"
description = "Video Intelligence Platform - any camera, local AI, modular vision, extensible intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Fase 2+: motor de reconocimiento facial (SCRFD + ArcFace) y busqueda vectorial.
vision = [
    "insightface",
    "onnxruntime",
    "faiss-cpu",
]
# Fase 6+: persistencia relacional.
storage = [
    "sqlalchemy>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
